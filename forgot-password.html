<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Chat | Reset Password</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <i class="fas fa-key auth-icon"></i>
                <h2>Reset Password</h2>
                <p>Enter your email to receive a reset link</p>
            </div>

            <div id="resetNotice" class="status-msg hidden"></div>

            <form id="resetForm" novalidate>
                <div class="field-group">
                    <label for="resetEmail">Registered Email</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="resetSubmitBtn" style="margin-top: 10px;">
                    <span class="btn-label">Send Reset Link</span>
                </button>
            </form>

            <div class="auth-footer-link">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
