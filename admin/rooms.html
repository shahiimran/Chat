<!-- Path: admin/rooms.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Chat | Admin - Room Requests</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Password Gate (UI convenience only — see note near checkAdminPass below) -->
    <div id="adminGate" class="auth-container" style="background: var(--bg-dark); position: fixed; z-index: 999; width: 100%; height: 100%;">
        <div class="glass-card" style="width: 100%; max-width: 300px; text-align: center;">
            <h3>Admin Access</h3>
            <input type="password" id="adminPassInput" placeholder="Enter Admin Code">
            <button onclick="checkAdminPass()" class="btn btn-primary">Enter</button>
            <p id="gateErr" style="color: var(--error); margin-top: 10px;"></p>
        </div>
    </div>

    <div class="admin-grid">
        <aside class="admin-sidebar">
            <h2 style="color: var(--accent);">ADMIN</h2>
            <hr style="border: 0.5px solid #333; margin: 20px 0;">
            <a href="dashboard.html" class="btn btn-outline" style="color:var(--accent); border-color:var(--accent); margin-bottom:10px;">User Management</a>
            <a href="rooms.html" class="btn btn-primary" style="margin-bottom: 10px;">Room Requests</a>
            <a href="messages.html" class="btn btn-outline" style="color:var(--accent); border-color:var(--accent); margin-bottom:10px;">Messages</a>
            <a href="broadcast.html" class="btn btn-outline" style="color:var(--accent); border-color:var(--accent); margin-bottom:10px;">Broadcast</a>
            <a href="../moderator/dashboard.html" class="btn btn-outline" style="color:var(--accent); border-color:var(--accent); margin-bottom:10px;">Mod Panel</a>
            <a href="../home.html" class="btn btn-outline" style="color:white; border-color:#333;">Exit</a>
        </aside>

        <main style="padding: 30px; overflow-y: auto;">
            <h1>Pending Room Requests</h1>
            <div class="admin-card">
                <div id="pendingRoomsList"></div>
            </div>

            <h1 style="margin-top: 30px;">Approved Rooms</h1>
            <div class="admin-card">
                <div id="approvedRoomsList"></div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/admin-rooms.js"></script>
    <script>
        // NOTE: UI convenience gate only, visible via page source — NOT real
        // security. Actual access control happens in js/admin-rooms.js
        // (requireRole) and must be backed by Firestore Security Rules.
        function checkAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            if(pass === "123qwe") {
                document.getElementById('adminGate').style.display = 'none';
            } else {
                document.getElementById('gateErr').innerText = "Wrong Code!";
            }
        }
    </script>
</body>
</html>
